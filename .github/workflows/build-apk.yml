name: Build Latest Jarvis ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Latest Jarvis APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find latest ZIP
        shell: bash
        run: |
          set -euo pipefail
          latest_zip=""
          latest_time=0

          while IFS= read -r -d '' zip; do
            commit_time="$(git log -1 --format=%ct -- "$zip" 2>/dev/null || echo 0)"
            echo "ZIP: $zip | commit: $commit_time"
            if [ "$commit_time" -ge "$latest_time" ]; then
              latest_time="$commit_time"
              latest_zip="$zip"
            fi
          done < <(git ls-files -z -- '*.zip')

          if [ -z "$latest_zip" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Selected latest ZIP: $latest_zip"
          echo "ZIP_FILE=$latest_zip" >> "$GITHUB_ENV"

      - name: Extract Jarvis project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf jarvis-build
          mkdir -p jarvis-build
          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d jarvis-build
          find jarvis-build -type d -exec chmod 755 {} +
          find jarvis-build -type f -exec chmod 644 {} +
          echo "Extraction successful."

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          settings_file="$(find jarvis-build -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"
          if [ -z "$settings_file" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi
          project_dir="$(dirname "$settings_file")"
          echo "Android project: $project_dir"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Source preflight
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/preflight.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          find app/build/outputs/apk -type f -name '*.apk' -print
          if [ "$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)" -eq 0 ]; then
            echo 'ERROR: APK was not generated.'
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-debug-apk
          path: '${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Unit tests (does not block the APK)
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-test-report
          path: '${{ env.PROJECT_DIR }}/app/build/reports/tests/testDebugUnitTest'
          if-no-files-found: ignore
          retention-days: 7
