name: Build Latest Jarvis APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Jarvis APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ============================================================
      # 2. Automatically find the latest ZIP
      #
      # No hard-coded ZIP filename.
      # The ZIP with the newest Git commit touching that file wins.
      # ============================================================
      - name: Find latest Jarvis ZIP
        shell: bash
        run: |
          set -euo pipefail

          latest_zip=""
          latest_time=0

          while IFS= read -r -d '' zip_file; do

            commit_time="$(git log -1 --format=%ct -- "$zip_file" 2>/dev/null || echo 0)"

            echo "Found ZIP: $zip_file"
            echo "Last commit time: $commit_time"

            if [ "$commit_time" -gt "$latest_time" ]; then
              latest_time="$commit_time"
              latest_zip="$zip_file"
            fi

          done < <(git ls-files -z -- '*.zip')

          if [ -z "$latest_zip" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo
          echo "============================================"
          echo "LATEST JARVIS ZIP:"
          echo "$latest_zip"
          echo "============================================"
          echo

          echo "ZIP_FILE=$latest_zip" >> "$GITHUB_ENV"


      # ============================================================
      # 3. Extract ZIP
      # ============================================================
      - name: Extract Jarvis project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf jarvis-build
          mkdir -p jarvis-build

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d jarvis-build

          echo "Extraction successful."


      # ============================================================
      # 4. Normalize permissions
      #
      # Protects against ZIPs carrying bad Unix permissions.
      # ============================================================
      - name: Normalize extracted permissions
        shell: bash
        run: |
          set -euo pipefail

          find jarvis-build \
            -type d \
            -exec chmod 755 {} +

          find jarvis-build \
            -type f \
            -exec chmod 644 {} +

          echo "Permissions normalized successfully."


      # ============================================================
      # 5. Locate Android Gradle project automatically
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          settings_file="$(
            find jarvis-build \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print -quit
          )"

          if [ -z "$settings_file" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"

          echo
          echo "============================================"
          echo "ANDROID PROJECT:"
          echo "$project_dir"
          echo "============================================"
          echo

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"


      # ============================================================
      # 6. JDK 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 7. Gradle 9.6.0
      #
      # IMPORTANT:
      # 9.6  ❌
      # 9.6.0 ✅
      # ============================================================
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"


      # ============================================================
      # 8. Verify environment
      # ============================================================
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java -version

          echo
          echo "===== GRADLE ====="
          gradle --version

          echo
          echo "===== ZIP ====="
          echo "$ZIP_FILE"

          echo
          echo "===== PROJECT ====="
          echo "$PROJECT_DIR"


      # ============================================================
      # 9. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle assembleDebug --stacktrace


      # ============================================================
      # 10. Verify APK was actually generated
      # ============================================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for APK..."

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          apk_count="$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" | wc -l
          )"

          if [ "$apk_count" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo
          echo "APK generated successfully."


      # ============================================================
      # 11. Upload APK as GitHub Artifact
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-debug-apk
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
