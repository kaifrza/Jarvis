name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Latest Jarvis ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Automatically find the latest ZIP modified in Git history.
      # No ZIP filename is hard-coded.
      # ------------------------------------------------------------
      - name: Find latest ZIP
        shell: bash
        run: |
          set -euo pipefail

          latest_zip=""
          latest_time=0

          while IFS= read -r -d '' zip; do
            commit_time="$(git log -1 --format=%ct -- "$zip" 2>/dev/null || echo 0)"

            echo "ZIP: $zip"
            echo "Last modified commit: $commit_time"

            if [ "$commit_time" -ge "$latest_time" ]; then
              latest_time="$commit_time"
              latest_zip="$zip"
            fi
          done < <(git ls-files -z -- '*.zip')

          if [ -z "$latest_zip" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "======================================"
          echo "Latest ZIP selected:"
          echo "$latest_zip"
          echo "======================================"

          echo "ZIP_FILE=$latest_zip" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Extract the selected ZIP
      # ------------------------------------------------------------
      - name: Extract Jarvis project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf jarvis-build
          mkdir -p jarvis-build

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d jarvis-build

          echo "Extraction successful."

          echo "Project contents:"
          find jarvis-build -maxdepth 3 -type f | head -100

      # ------------------------------------------------------------
      # Automatically locate Android project
      # ------------------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          settings_file="$(
            find jarvis-build \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit
          )"

          if [ -z "$settings_file" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"

          echo "Android project found:"
          echo "$project_dir"

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Java
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # Gradle
      # AGP 9.4 officially uses Gradle 9.6 as its default version.
      # ------------------------------------------------------------
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6"

      # ------------------------------------------------------------
      # Show build environment
      # ------------------------------------------------------------
      - name: Verify build environment
        shell: bash
        run: |
          java -version
          gradle --version

          echo "ZIP:"
          echo "$ZIP_FILE"

          echo "PROJECT:"
          echo "$PROJECT_DIR"

      # ------------------------------------------------------------
      # Build APK
      # ------------------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle assembleDebug --stacktrace

      # ------------------------------------------------------------
      # Verify APK
      # ------------------------------------------------------------
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for APK..."

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          apk_count="$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" | wc -l
          )"

          if [ "$apk_count" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK verification successful."

      # ------------------------------------------------------------
      # Upload APK artifact
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-debug-apk
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
