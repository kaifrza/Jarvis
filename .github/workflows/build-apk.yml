name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Jarvis-Engineering-Pass-0.2-FINAL.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Jarvis project
        run: |
          rm -rf jarvis-build
          mkdir -p jarvis-build
          unzip -q "Jarvis-Engineering-Pass-0.2.zip" -d jarvis-build

          echo "Extracted files:"
          find jarvis-build -maxdepth 3 -type f | head -100

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find jarvis-build -name settings.gradle.kts -o -name settings.gradle | head -1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-debug-apk
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
